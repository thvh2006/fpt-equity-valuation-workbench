name: quality

on:
  push:
  pull_request:

jobs:
  model-and-data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce Clock B
        run: python scripts/run_clock_b.py
      - name: Run repository checks
        run: python scripts/run_checks.py
      - name: Confirm generated output is committed
        run: git diff --exit-code -- reports/clock_b_summary.json
